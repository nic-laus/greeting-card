<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cheer up!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff3f6;
    --bg2: #ffd9e4;
    --ink: #4a2b3d;
    --berry: #e0527f;
    --lavender: #cdb8f5;
    --font: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--ink);
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .bubble {
    position: relative;
    max-width: min(88vw, 360px);
    min-height: 4.2em;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 22px;
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 28px;
    font-size: clamp(1.25rem, 5.5vw, 1.7rem);
    font-weight: 600;
    line-height: 1.25;
    text-align: center;
    margin-bottom: 22px;
  }
  .bubble::after {
    content: ""; position: absolute; left: 50%; bottom: -17px;
    width: 26px; height: 26px; background: #fff;
    border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink);
    transform: translateX(-50%) rotate(45deg);
  }
  .bubble.pop { animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.04); } 100% { transform: scale(1); } }

  button.kitty {
    background: none; border: 0; padding: 0; cursor: pointer;
    width: min(70vw, 300px);
    animation: bob 3s ease-in-out infinite;
  }
  button.kitty:focus-visible { outline: 3px dashed var(--berry); outline-offset: 8px; border-radius: 24px; }
  button.kitty.hop { animation: hop .5s ease; }
  button.kitty svg { width: 100%; height: auto; display: block; overflow: visible; }
  /* Your own picture: save it next to this file as kitty.png */
  button.kitty img { display: none; width: 100%; height: auto; mix-blend-mode: multiply; pointer-events: none; }
  button.kitty.useimg { background: #fff; border: 3px solid var(--ink); border-radius: 36px; padding: 10px; overflow: hidden; }
  button.kitty.useimg img { display: block; }
  button.kitty.useimg svg { display: none; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  @keyframes hop { 0% { transform: translateY(0); } 35% { transform: translateY(-34px) rotate(-3deg); } 70% { transform: translateY(0) rotate(2deg); } 100% { transform: none; } }

  /* bouquet appears on first tap */
  #bouquet { transform-box: fill-box; transform-origin: 50% 100%; transform: scale(0); opacity: 0; transition: transform .6s cubic-bezier(.3,1.6,.5,1), opacity .3s; }
  .given #bouquet { transform: scale(1); opacity: 1; }
  .blink { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

  .hint { margin-top: 18px; font-size: 1rem; opacity: .65; transition: opacity .4s; }
  .given .hint { opacity: 0; }

  .fall, .float {
    position: fixed; pointer-events: none; z-index: 10; will-change: transform, opacity;
  }
  .fall { top: -40px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }
  .float { animation: rise 1.6s ease-out forwards; }
  @keyframes rise { to { transform: translate(var(--dx), -140px) scale(1.3); opacity: 0; } }

  .music {
    position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 14px; z-index: 20;
    width: 46px; height: 46px; border-radius: 50%;
    background: #fff; border: 3px solid var(--ink);
    font-size: 1.3rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .music[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    button.kitty, .blink { animation: none; }
    .fall, .float { display: none; }
  }
</style>
</head>
<body>

<div class="bubble" id="bubble" aria-live="polite"></div>

<button class="kitty" id="kitty" aria-label="Tap the kitty">
  <img id="kittyImg" src="kitty.png" alt="Kitty holding flowers">
  <svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A cute white kitty with a pink flower on her ear">
    <defs>
      <g id="flower">
        <circle cx="0" cy="-11" r="9"/><circle cx="10.5" cy="-3.4" r="9"/>
        <circle cx="6.5" cy="9" r="9"/><circle cx="-6.5" cy="9" r="9"/>
        <circle cx="-10.5" cy="-3.4" r="9"/>
        <circle cx="0" cy="0" r="6" fill="#ffd34d"/>
      </g>
    </defs>

    <!-- dress -->
    <ellipse cx="150" cy="275" rx="62" ry="56" fill="#cdb8f5" stroke="#4a2b3d" stroke-width="3"/>
    <!-- ears -->
    <path d="M68 125 L60 58 Q96 66 120 98 Z" fill="#fff" stroke="#4a2b3d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M232 125 L240 58 Q204 66 180 98 Z" fill="#fff" stroke="#4a2b3d" stroke-width="3" stroke-linejoin="round"/>
    <path d="M76 112 L72 80 Q90 86 104 102 Z" fill="#ffc2d4"/>
    <path d="M224 112 L228 80 Q210 86 196 102 Z" fill="#ffc2d4"/>
    <!-- head -->
    <ellipse cx="150" cy="168" rx="106" ry="80" fill="#fff" stroke="#4a2b3d" stroke-width="3"/>
    <!-- flower on ear -->
    <g transform="translate(222 92) scale(.95)" fill="#ff8fb1" stroke="#4a2b3d" stroke-width="2"><use href="#flower"/></g>
    <!-- face -->
    <g class="blink">
      <ellipse cx="105" cy="170" rx="7" ry="9.5" fill="#4a2b3d"/>
      <ellipse cx="195" cy="170" rx="7" ry="9.5" fill="#4a2b3d"/>
      <circle cx="102.5" cy="166" r="2.4" fill="#fff"/><circle cx="192.5" cy="166" r="2.4" fill="#fff"/>
    </g>
    <ellipse cx="82" cy="192" rx="15" ry="9" fill="#ff9fba" opacity=".6"/>
    <ellipse cx="218" cy="192" rx="15" ry="9" fill="#ff9fba" opacity=".6"/>
    <ellipse cx="150" cy="184" rx="8" ry="5.5" fill="#ff7fa3"/>
    <path d="M139 197 Q144.5 206 150 198 Q155.5 206 161 197" fill="none" stroke="#4a2b3d" stroke-width="3" stroke-linecap="round"/>
    <g stroke="#4a2b3d" stroke-width="2.5" stroke-linecap="round">
      <path d="M44 160 L78 167"/><path d="M40 182 L76 182"/><path d="M45 204 L79 197"/>
      <path d="M256 160 L222 167"/><path d="M260 182 L224 182"/><path d="M255 204 L221 197"/>
    </g>

    <!-- bouquet -->
    <g id="bouquet">
      <g stroke="#5aa86b" stroke-width="4" stroke-linecap="round">
        <path d="M150 262 L128 236"/><path d="M150 262 L150 222"/><path d="M150 262 L172 236"/>
      </g>
      <path d="M118 252 L182 252 L150 318 Z" fill="#ffe3ee" stroke="#4a2b3d" stroke-width="3" stroke-linejoin="round"/>
      <g stroke="#4a2b3d" stroke-width="2">
        <g transform="translate(126 232) scale(.85)" fill="#ff8fb1"><use href="#flower"/></g>
        <g transform="translate(150 216) scale(.95)" fill="#ffffff"><use href="#flower"/></g>
        <g transform="translate(174 232) scale(.85)" fill="#b79bf0"><use href="#flower"/></g>
      </g>
    </g>

    <!-- paws -->
    <ellipse cx="108" cy="262" rx="14" ry="11" fill="#fff" stroke="#4a2b3d" stroke-width="3"/>
    <ellipse cx="192" cy="262" rx="14" ry="11" fill="#fff" stroke="#4a2b3d" stroke-width="3"/>
  </svg>
</button>

<p class="hint">tap the kitty</p>

<!-- Your song: save it next to this file as song.mp3 -->
<audio id="song" src="song.mp3" loop preload="auto"></audio>
<button class="music" id="musicBtn" aria-label="Play music">🔇</button>

<script>
  // Her name: edit this, or open the page with ?name=Her%20Name
  const DEFAULT_NAME = "NAME";
  const NAME = new URLSearchParams(location.search).get("name") || DEFAULT_NAME;

  const messages = [
    "Friendly reminder: You're doing amazing. Stop overthinking.",
    "Your brain is lying to you right now. Go drink some water.",
    "Even when you're stressed, you're still pretty cute.",
    "System error: Department head needs a nap immediately.",
    "You're allowed to have bad days, Ms. Manager.",
    "Okay, stop clicking. Go text me and rant instead."
  ];

  const kitty = document.getElementById("kitty");
  const kittyImg = document.getElementById("kittyImg");
  // If kitty.png sits next to this file, use it; otherwise the drawn kitty stays.
  function checkImg() { if (kittyImg.complete && kittyImg.naturalWidth > 0) kitty.classList.add("useimg"); }
  kittyImg.addEventListener("load", checkImg);
  checkImg();
  const bubble = document.getElementById("bubble");
  let i = 0;
  let given = false;

  function say(text) {
    bubble.textContent = text;           // textContent keeps the ?name= value safe
    bubble.classList.remove("pop");
    void bubble.offsetWidth;             // restart the animation
    bubble.classList.add("pop");
  }

  function rain(emojis, count) {
    for (let n = 0; n < count; n++) {
      const el = document.createElement("span");
      el.className = "fall";
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.fontSize = 18 + Math.random() * 18 + "px";
      el.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
      el.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
      el.style.animationDuration = 3 + Math.random() * 3 + "s";
      el.style.animationDelay = Math.random() * 0.8 + "s";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  function hearts(x, y) {
    for (let n = 0; n < 5; n++) {
      const el = document.createElement("span");
      el.className = "float";
      el.textContent = "💗";
      el.style.left = x + (Math.random() * 80 - 40) + "px";
      el.style.top = y + (Math.random() * 30 - 15) + "px";
      el.style.setProperty("--dx", (Math.random() * 60 - 30) + "px");
      el.style.animationDelay = n * 0.08 + "s";
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }

  // ---- music (browsers only allow sound after a tap, so it starts on the first tap) ----
  const song = document.getElementById("song");
  const musicBtn = document.getElementById("musicBtn");

  function setMusicUI() {
    const playing = !song.paused;
    musicBtn.textContent = playing ? "🔊" : "🔇";
    musicBtn.setAttribute("aria-label", playing ? "Mute music" : "Play music");
  }
  function startMusic() {
    song.volume = 0.7;
    song.play().then(setMusicUI).catch(() => {});
  }
  musicBtn.addEventListener("click", () => {
    if (song.paused) startMusic(); else { song.pause(); setMusicUI(); }
  });
  // no song.mp3 next to the page? hide the button
  song.addEventListener("error", () => { musicBtn.hidden = true; });
  if (song.networkState === 3) musicBtn.hidden = true;

  kitty.addEventListener("click", (e) => {
    kitty.classList.remove("hop");
    void kitty.offsetWidth;
    kitty.classList.add("hop");

    const r = kitty.getBoundingClientRect();
    hearts(r.left + r.width / 2, r.top + r.height * 0.3);

    if (!given) {
      given = true;
      startMusic();
      document.body.classList.add("given");
      rain(["🌸", "🌷", "🌼"], 26);
      i = 1;
    } else {
      i = (i + 1) % messages.length;
      rain(["🌸", "💗"], 8);
    }
    say(messages[i]);
  });

  kitty.addEventListener("animationend", () => kitty.classList.remove("hop"));
  say(messages[0]);
</script>
</body>
</html>
